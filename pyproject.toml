[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "miclisten"
version = "0.5.3"
description = "Listen to microphones and Windows audio outputs in a web browser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "lameenc>=1.8,<2",
    "uvicorn[standard]>=0.30,<1",
    "PyAudioWPatch>=0.2.12.7; sys_platform == 'win32'",
    "PyAudio>=0.2.14; sys_platform != 'win32'",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8",
]

[project.scripts]
miclisten = "miclisten.__main__:main"

[tool.setuptools.packages.find]
include = ["miclisten*"]

[tool.setuptools.package-data]
miclisten = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

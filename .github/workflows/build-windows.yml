name: Build Windows installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    outputs:
      app-version: ${{ steps.version.outputs.value }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install "pyinstaller==6.18.0"

      - name: Run tests
        shell: pwsh
        run: python -m pytest

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build standalone executable
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm packaging\MicListen.spec

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $port = 18765
          $log = Join-Path $env:LOCALAPPDATA "MicListen\miclisten.log"
          & dist\MicListen.exe --host localhost --port $port --background

          $health = $null
          for ($attempt = 0; $attempt -lt 60 -and $null -eq $health; $attempt++) {
            try {
              $health = Invoke-RestMethod -Uri "http://localhost:$port/api/health" -TimeoutSec 1
            }
            catch {
              Start-Sleep -Milliseconds 250
            }
          }

          if ($null -eq $health) {
            if (Test-Path -LiteralPath $log) {
              Get-Content -LiteralPath $log -Tail 200
            }
            throw 'Packaged MicListen failed to start using a hostname.'
          }

          try {
            if ($health.version -ne '${{ steps.version.outputs.value }}') {
              throw "Packaged version $($health.version) does not match the project version."
            }
            if ($health.audio_error -match '_portaudiowpatch') {
              throw "Packaged audio extension is missing: $($health.audio_error)"
            }
          }
          finally {
            Invoke-RestMethod -Method Post `
              -Uri "http://localhost:$port/api/shutdown" `
              -Headers @{ Origin = "http://localhost:$port" } `
              -TimeoutSec 2
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Verify installer policy
        shell: pwsh
        run: |
          $script = Get-Content -Raw installer\MicListen.iss
          if ($script -notmatch '(?m)^PrivilegesRequired=lowest\r?$') {
            throw 'Installer must use lowest privileges.'
          }
          if ($script -notmatch '(?m)^PrivilegesRequiredOverridesAllowed=[ \t]*\r?$') {
            throw 'All-users privilege overrides must be disabled.'
          }
          if ($script -notmatch '(?m)^DefaultDirName=\{localappdata\}') {
            throw 'Installer must install below the user profile.'
          }
          if ($script -match '(?m)^\[Run\]') {
            throw 'Installer must never run MicListen.'
          }
          if ($script -match '(?i)\b(ShellExec|Exec)\s*\(') {
            throw 'Installer code must not execute any program.'
          }
          if ($script -match '\{userdesktop\}') {
            throw 'Installer must not create a desktop shortcut.'
          }

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $iscc = (Get-Command ISCC.exe).Source
          & $iscc "/DAppVersion=$env:APP_VERSION" installer\MicListen.iss

      - name: Stage release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            dist/MicListen.exe
            dist/installer/MicListen-${{ steps.version.outputs.value }}-Setup.exe
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check tag version
        shell: bash
        env:
          APP_VERSION: ${{ needs.build.outputs.app-version }}
        run: |
          expected_tag="v${APP_VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${expected_tag}." >&2
            exit 1
          fi

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release-files

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.build.outputs.app-version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-files/MicListen.exe \
            "release-files/installer/MicListen-${APP_VERSION}-Setup.exe" \
            --verify-tag \
            --generate-notes \
            --title "MicListen ${APP_VERSION}"
